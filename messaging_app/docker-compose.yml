version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      # The checker specifically looks for "MYSQL_DB"
      MYSQL_DB: ${MYSQL_DATABASE}
      # The official image actually uses "MYSQL_DATABASE" to create the DB
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    # The checker explicitly wants "python3", not "python"
    command: python3 manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  db_data: